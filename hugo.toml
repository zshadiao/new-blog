# 正式域名（Porkbun 已注册：lanzhongying.lol，根域绑定 GitHub Pages）
baseURL = 'https://lanzhongying.lol/'
locale = 'zh-CN'
title = '雕某人书坊'
theme = 'PaperMod'

enableRobotsTXT = true
enableEmoji = true
pygmentsUseClasses = true

# ===== 分类体系 =====
[taxonomies]
  category = 'categories'
  tag = 'tags'
  series = 'series'

# ===== 主题参数（PaperMod） =====
[params]
  env = 'production'
  title = '雕某人书坊'
  description = '分享近况与有趣的书'
  author = '雕'
  defaultTheme = 'auto'       # auto: 跟随系统深浅色；可选 light / dark
  disableThemeToggle = false
  ShowReadingTime = true
  ShowShareButtons = false
  ShowCodeCopyButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowWordCount = true
  ShowToc = true              # 文章目录
  ShowFullTextinRSS = true
  ShowAllPagesInArchive = true

  [params.homeInfoParams]     # 首页欢迎区
    Title = '欢迎来到雕某人书坊'
    Content = "这里是我的个人空间，分享我的近况与一些“有趣”的书。\n\n保持好奇，持续输出。"

  [params.label]
    text = '雕某人书坊'
    iconHeight = 0

  # 社交链接：在 name 填平台，url 填你的主页，按需增删
  # 支持 github / twitter / x / mastodon / email 等图标
  [[params.socialIcons]]
    name = 'github'
    url = 'https://github.com/zshadiao'
  [[params.socialIcons]]
    name = 'email'
    url = 'mailto:lanzhongying@gmail.com'

  # ===== 顶部导航菜单 =====
  [[menu.main]]
    identifier = 'archives'
    name = '归档'
    url = '/archives/'
    weight = 1

  [[menu.main]]
    identifier = 'search'
    name = '搜索'
    url = '/search/'
    weight = 2

  [[menu.main]]
    identifier = 'about'
    name = '关于'
    url = '/about/'
    weight = 3

# ===== 隐私与安全 =====
[privacy]
  [privacy.googleAnalytics]
    anonymizeIP = true
  [privacy.vimeo]
    disable = true
  [privacy.youtube]
    privacyEnhanced = true
