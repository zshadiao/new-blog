# ===== 基础配置 =====
# TODO: 上线前把 baseURL 换成你的真实域名，例如 https://blog.example.com/
baseURL = 'https://your-domain.com/'
locale = 'zh-CN'
title = '我的博客'          # TODO: 改成你的博客名
theme = 'PaperMod'

enableRobotsTXT = true
enableEmoji = true
pygmentsUseClasses = true

# ===== 分类体系 =====
[taxonomies]
  category = 'categories'
  tag = 'tags'
  series = 'series'

# ===== 主题参数（PaperMod） =====
[params]
  env = 'production'
  title = '我的博客'          # TODO: 同步修改博客名
  description = '个人博客，记录技术、思考与生活'   # TODO: 改成你的站点描述
  author = '你的名字'         # TODO: 改成你的署名
  defaultTheme = 'auto'       # auto: 跟随系统深浅色；可选 light / dark
  disableThemeToggle = false
  ShowReadingTime = true
  ShowShareButtons = false
  ShowCodeCopyButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowWordCount = true
  ShowToc = true              # 文章目录
  ShowFullTextinRSS = true
  ShowAllPagesInArchive = true

  [params.homeInfoParams]     # 首页欢迎区
    Title = '欢迎来到我的博客'
    Content = "这里是我的个人空间，主要记录 [TODO: 你的领域]。\n\n保持好奇，持续输出。"

  [params.label]
    text = '我的博客'         # 站点左上角 Logo 文字，TODO: 同步修改
    iconHeight = 0

  # 社交链接：在 name 填平台，url 填你的主页，按需增删
  # 支持 github / twitter / x / mastodon / email 等图标
  [[params.socialIcons]]
    name = 'github'
    url = 'https://github.com/你的用户名'   # TODO
  [[params.socialIcons]]
    name = 'email'
    url = 'mailto:you@example.com'          # TODO

  # ===== 顶部导航菜单 =====
  [[menu.main]]
    identifier = 'archives'
    name = '归档'
    url = '/archives/'
    weight = 1

  [[menu.main]]
    identifier = 'search'
    name = '搜索'
    url = '/search/'
    weight = 2

  [[menu.main]]
    identifier = 'about'
    name = '关于'
    url = '/about/'
    weight = 3

# ===== 隐私与安全 =====
[privacy]
  [privacy.googleAnalytics]
    anonymizeIP = true
  [privacy.vimeo]
    disable = true
  [privacy.youtube]
    privacyEnhanced = true
